<!DOCTYPE html>
<html>
  <body>
    <input id="input" placeholder="Enter password here"></input>
    <button id="verify">Verify</button>
  </body>
  <script>
    import {sha256} from "/hash.js"

    const inputField = document.getElementById("input")
    const verifyButton = document.getElementById("verify")
    
    async function verifyButtonOnclick() {
      if (await sha256(inputField.value) == "0") {
        alert("You found it!")
      }
    }
    verifyButton.addEventListener("click", verifyButtonOnclick)
  </script>
</html>
